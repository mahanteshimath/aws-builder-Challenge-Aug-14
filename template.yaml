AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Dream Postcards - describe a dream, get a vintage travel postcard.

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 60
    MemorySize: 1024
    Architectures: [arm64]

Resources:
  PostcardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  PostcardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: index.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref PostcardsTable
          DAILY_CARD_CAP: "500"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [GET, POST]
          AllowHeaders: [content-type]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PostcardsTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/amazon.nova-lite-v1:0

Outputs:
  FunctionUrl:
    Description: Public endpoint - POST /dream, GET /p/{id}
    Value: !GetAtt PostcardFunctionUrl.FunctionUrl
  FunctionName:
    Value: !Ref PostcardFunction
  TableName:
    Value: !Ref PostcardsTable
